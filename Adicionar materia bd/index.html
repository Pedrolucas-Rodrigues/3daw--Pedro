<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Disciplinas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #004494; }
        #mensagem { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>Nova Disciplina</h2>

    <form id="formDisciplina">
        <div class="campo">
            <label for="nome">Nome da Disciplina:</label>
            <input type="text" id="nome" placeholder="Ex: Programação Web" required>
        </div>

        <div class="campo">
            <label for="codigo">Código:</label>
            <input type="text" id="codigo" placeholder="Ex: WEB101" required>
        </div>

        <div class="campo">
            <label for="carga_horaria">Carga Horária (horas):</label>
            <input type="number" id="carga_horaria" min="1" placeholder="Ex: 60" required>
        </div>

        <button type="submit" id="btnSalvar">Cadastrar Disciplina</button>
    </form>

    <div id="mensagem"></div>

    <script src="script.js"></script>
</body>
</html>
